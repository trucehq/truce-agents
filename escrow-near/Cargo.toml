[package]
name = "truce-escrow-near"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Minimal, non-custodial NEAR escrow with a neutral settlement step (TruceHQ agreement digest)."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30"

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
