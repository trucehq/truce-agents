[package]
name = "truce-escrow"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Minimal, non-custodial Solana escrow with a neutral settlement step (TruceHQ agreement digest)."
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []

[dependencies]
solana-program = "=2.3.0"

[dev-dependencies]
solana-program-test = "=2.3.13"
solana-sdk = "2.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.dev]
debug = 0

[profile.dev.package."*"]
opt-level = 1

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))', 'cfg(feature, values("custom-heap", "custom-panic"))'] }
