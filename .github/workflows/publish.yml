name: Publish packages
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: "pypi, npm or both"
        default: "pypi"
permissions:
  contents: read
  id-token: write
jobs:
  pypi:
    if: github.event_name == 'release' || inputs.target != 'npm'
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install build && python -m build python
      - uses: pypa/gh-action-pypi-publish@release/v1
        with: { packages-dir: python/dist }
  npm:
    if: (github.event_name == 'release' && vars.NPM_TRUSTED == 'true') || inputs.target == 'npm' || inputs.target == 'both'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", registry-url: "https://registry.npmjs.org" }
      - run: npm install -g npm@latest
      - run: npm stage publish --access public
        working-directory: js
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
